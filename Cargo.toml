[package]
name = "ttsai"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Official Rust SDK for the TTS.ai REST API. Async, mirrors the Python/JS/PHP/Go/Ruby SDK method shapes."
license = "Apache-2.0"
repository = "https://github.com/ttsaigit/tts-rust"
homepage = "https://tts.ai"
documentation = "https://docs.rs/ttsai"
readme = "README.md"
keywords = ["tts", "text-to-speech", "speech-synthesis", "voice-cloning", "tts-ai"]
categories = ["api-bindings", "multimedia::audio"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
# Pin below 0.6.5 — that version requires edition2024 (Rust 1.85+).
# We keep MSRV at 1.80 so older toolchains can still build.
wiremock = ">=0.6.0, <0.6.5"
